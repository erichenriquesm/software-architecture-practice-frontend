# Production image: static files on its own port; the API routes go to the edge, so the browser keeps one origin.
server {
  listen 5173;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $edge http://edge;

  location ~ ^/(signup|login|logout|me|accounts|orders|deposit|withdraw|place_order|cancel_order|markets)(/|$) {
    proxy_pass $edge;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
