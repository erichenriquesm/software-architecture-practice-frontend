# Production image: static files on its own port; the API routes go to the edge, so the browser keeps one origin.
server_tokens off;

server {
  listen 5173;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $edge http://edge;

  # Inline style attributes come from Vue bindings (bar widths); scripts only from this origin
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ~ ^/(signup|login|logout|me|accounts|orders|deposit|withdraw|place_order|cancel_order|markets)(/|$) {
    proxy_pass $edge;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location / { try_files $uri /index.html; }
}
